name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cinephiles/package-lock.json

      - name: Install dependencies
        working-directory: cinephiles
        run: npm ci

      - name: Build
        working-directory: cinephiles
        run: npm run build

      - name: SPA fallback
        run: |
          cp cinephiles/dist/index.html cinephiles/dist/404.html
          touch cinephiles/dist/.nojekyll

      - name: Sync build into docs/
        run: |
          rm -rf docs
          mkdir docs
          cp -r cinephiles/dist/. docs/

      - name: Commit and push docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || git commit -m "chore: update docs from build [skip ci]"
          git push